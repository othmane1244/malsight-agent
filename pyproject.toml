[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malsight-agent"
version = "0.1.0"
description = "Agent IA défensif pour l'analyse assistée de malware (pédagogique)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
malsight = "malsight.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
malsight = ["report/templates/*.j2"]

[tool.pytest.ini_options]
# Les tests qui lancent PowerShell sont marqués « slow » et exclus par défaut.
# Les lancer : pytest -m slow ; tout lancer (CI) : pytest -m "slow or not slow".
markers = ["slow: lance PowerShell (exclu par défaut ; pytest -m slow pour les lancer)"]
addopts = "-m 'not slow'"
